name: release

# Builds x86_64 firecracker + sibling tools via devtool and attaches
# them to a GitHub Release whenever a `v*` tag is pushed.
# Example tag: `v1.16.0-rc1`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create/update releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build via devtool
        run: |
          set -euo pipefail
          ./tools/devtool -y build --release

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          REL_DIR=build/cargo_target/x86_64-unknown-linux-musl/release
          OUT=release-staging
          mkdir -p "$OUT"

          TAG="${GITHUB_REF#refs/tags/}"
          ARCH=x86_64
          for bin in firecracker jailer cpu-template-helper snapshot-editor; do
            [ -x "$REL_DIR/$bin" ] || { echo "missing $bin"; exit 1; }
            cp "$REL_DIR/$bin" "$OUT/${bin}-${TAG}-${ARCH}"
          done

          ( cd "$OUT" && sha256sum *-${ARCH} > "SHA256SUMS-${TAG}.txt" )

          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "out=$OUT"   >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: ${{ steps.stage.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.stage.outputs.out }}/*
